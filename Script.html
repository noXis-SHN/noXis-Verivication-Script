<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>noXis-script | Portal Resmi</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        :root{
            --gelap:#0f0f1a; --card:#1a1a2e;
            --ungu:#7928ca; --ungu2:#ff0080;
            --hijau:#00e080; --biru:#2563eb;
            --merah:#ff3355; --putih:#ffffff;
        }
        body{
            background:linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            color:var(--putih); min-height:100vh;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            padding:30px 20px;
            background-attachment:fixed;
        }

        /* ========= LOGO & JUDUL ========= */
        .logo-kotak{
            background:linear-gradient(135deg,var(--ungu),var(--ungu2));
            width:120px; height:120px; border-radius:24px;
            display:flex; align-items:center; justify-content:center;
            font-size:2.8rem; font-weight:bold;
            margin-bottom:20px;
            box-shadow:0 0 40px rgba(121,40,202,0.5);
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-10px);}
        }
        h1{
            font-size:2.5rem; font-weight:800;
            background:linear-gradient(90deg,var(--putih),var(--putih));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            color:var(--putih);
            letter-spacing:3px; margin-bottom:5px;
        }
        .sub-judul{
            color:var(--ungu2); font-size:1.1rem; margin-bottom:50px;
            letter-spacing:1px;
        }

        /* ========= TOMBOL UTAMA — BESAR & PANJANG ========= */
        .tombol-utama{
            width:100%; max-width:420px;
            padding:28px 20px; border-radius:16px;
            background:linear-gradient(90deg,var(--ungu),var(--ungu2));
            color:white; border:none;
            font-size:1.3rem; font-weight:700;
            cursor:pointer; text-decoration:none;
            display:flex; align-items:center; justify-content:center;
            gap:12px;
            margin-bottom:35px;
            box-shadow:0 0 30px rgba(121,40,202,0.4);
            transition:all 0.3s ease;
            border:2px solid transparent;
        }
        .tombol-utama:hover{
            transform:translateY(-4px) scale(1.02);
            box-shadow:0 10px 40px rgba(121,40,202,0.5);
            border-color:rgba(255,255,255,0.2);
        }
        .ikon-besar{font-size:1.6rem;}

        /* ========= 3 TOMBOL KECIL — KUBUS ========= */
        .tombol-sosial-wadah{
            display:grid; grid-template-columns:repeat(3,1fr);
            gap:20px; width:100%; max-width:420px;
        }
        .tombol-sosial{
            aspect-ratio:1/1; border-radius:16px;
            background:rgba(255,255,255,0.05);
            border:2px solid rgba(255,255,255,0.1);
            color:white; text-decoration:none;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center;
            gap:8px;
            transition:all 0.3s ease;
            cursor:pointer;
        }
        .tombol-sosial:hover{
            transform:translateY(-5px) scale(1.05);
            border-color:var(--ungu);
            background:rgba(121,40,202,0.15);
            box-shadow:0 8px 25px rgba(121,40,202,0.3);
        }
        .tombol-sosial.wa:hover{border-color:#25d366; background:rgba(37,211,102,0.1); box-shadow:0 8px 25px rgba(37,211,102,0.25);}
        .tombol-sosial.tiktok:hover{border-color:#000000; background:rgba(255,255,255,0.08); box-shadow:0 8px 25px rgba(255,0,80,0.25);}
        .tombol-sosial.discord:hover{border-color:#5865f2; background:rgba(88,101,242,0.1); box-shadow:0 8px 25px rgba(88,101,242,0.25);}
        
        .ikon-sosial{font-size:1.8rem;}
        .label-sosial{font-size:0.85rem; font-weight:500; opacity:0.8;}

        /* ========= FOOTER ========= */
        footer{
            margin-top:50px; color:var(--abu);
            font-size:0.85rem; opacity:0.5;
        }

        /* RESPONSIVE HP */
        @media (max-width:480px){
            h1{font-size:2rem;}
            .logo-kotak{width:100px; height:100px; font-size:2.2rem;}
            .tombol-utama{padding:24px 20px; font-size:1.15rem;}
            .tombol-sosial-wadah{gap:15px;}
        }
    </style>
</head>
<body>

    <!-- LOGO -->
    <div class="logo-kotak">𝓷𝕩</div>
    <h1>noXis-script</h1>
    <p class="sub-judul">Portal Resmi & Verifikasi</p>

    <!-- TOMBOL UTAMA — BESAR -->
    <a href="GANTI_LINK_VERIFIKASI_DI_SINI" class="tombol-utama">
        <span class="ikon-besar">🔐</span>
        HALAMAN VERIFIKASI
    </a>

    <!-- 3 TOMBOL SOSIAL — KUBUS KECIL -->
    <div class="tombol-sosial-wadah">
        <!-- TIKTOK -->
        <a href="" target="_blank" class="tombol-sosial tiktok">
            <span class="ikon-sosial">🎵</span>
            <span class="label-sosial">TikTok</span>
        </a>

        <!-- WHATSAPP -->
        <a href="https://whatsapp.com/channel/0029Vb8jaVPBfxoEu1jTKc1H" target="_blank" class="tombol-sosial wa">
            <span class="ikon-sosial">💬</span>
            <span class="label-sosial">WhatsApp</span>
        </a>

        <!-- DISCORD -->
        <a href="GANTI_LINK_DISCORD_DI_SINI" target="_blank" class="tombol-sosial discord">
            <span class="ikon-sosial">💜</span>
            <span class="label-sosial">Discord</span>
        </a>
    </div>

    <footer>© 2026 noXis-script — All Rights Reserved</footer>

</body>
</html>
